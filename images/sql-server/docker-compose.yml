name: app-adventureworks

services:
  db-server:
    image: adventure-works-db-server
    container_name: db-server
    volumes:
      - ./scripts/db/adventure-works:/tmp/a_my_src/data
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_SA_PASSWORD}
    ports:
      - 1433:1433
    build:
      dockerfile: db-server.Dockerfile
  db-client:
    depends_on:
      db-server:
        condition: service_healthy
    env_file:
      - sql-server-env.env
    image: adventure-works-db-client
    container_name: db-client
    volumes:
      - ./scripts/db:/tmp/a_my_src/db
    environment:
      - MSSQL_SA_PASSWORD=${DB_SA_PASSWORD}
    build:
      dockerfile: db-client.Dockerfile
